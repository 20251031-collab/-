<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔡敏诗 - 聯絡我們</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <div class="logo">蔡敏诗</div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="products.html">產品介紹</a></li>
            <li><a href="contact.html" class="active">聯絡我們</a></li>
        </ul>
    </nav>

    <!-- 聯絡我們主要內容 -->
    <main class="contact-page">
        <h1>聯絡我們</h1>
        <p>有任何問題或合作機會，歡迎隨時與我們聯繫。</p>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">電子郵件：</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">訊息：</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="cta-btn">送出訊息</button>
        </form>
        <p id="formResponse" class="form-response"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
