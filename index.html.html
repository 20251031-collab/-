<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔡敏诗 - 首頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <div class="logo">蔡敏诗</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">首頁</a></li>
            <li><a href="products.html">產品介紹</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
    </nav>

    <!-- 首頁主要內容 -->
    <header class="hero">
        <h1>歡迎來到 蔡敏诗</h1>
        <p>簡約 · 青春 · 科技感，為你帶來全新的產品體驗。</p>
        <button id="promoBtn" class="cta-btn">點我領取優惠</button>
    </header>

    <!-- 圖片輪播區 -->
    <section class="carousel-section">
        <h2>精選產品展示</h2>
        <div class="carousel-container">
            <div class="carousel-slide">
                <img src="https://picsum.photos/800/400?random=1" alt="產品展示 1">
                <img src="https://picsum.photos/800/400?random=2" alt="產品展示 2">
                <img src="https://picsum.photos/800/400?random=3" alt="產品展示 3">
            </div>
            <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
            <button class="carousel-btn next" id="nextBtn">&#10095;</button>
        </div>
    </section>

    <!-- 彈出優惠訊息視窗 -->
    <div id="promoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>🎉 專屬優惠！</h2>
            <p>感謝你關注 <strong>蔡敏诗</strong>！</p>
            <p>輸入優惠碼 <strong>MIN10</strong> 即可享有 9 折優惠！</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
